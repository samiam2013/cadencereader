apiVersion: batch/v1
kind: CronJob
metadata:
  name: rssimport
spec:
  schedule: "15 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: rssimport
              image: rssimport:latest
              imagePullPolicy: Never
              resources:
                limits:
                  memory: "200Mi"
                  cpu: "200m"
              env:
{{- include "env.shared" . | indent 10 }}

          
